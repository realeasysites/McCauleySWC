<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin sign in | McCauley Stoneworks</title>
<link rel="stylesheet" href="/css/admin.css"></head>
<body class="login"><form method="post" action="/admin/login" class="card">
<img src="/img/logo.png" alt="" width="110" height="110"><h1>Lead dashboard</h1>
<p id="err" class="err" hidden>Incorrect username or password.</p>
<label>Username<input name="username" autocomplete="username" required></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<button class="btn" type="submit">Sign in</button></form>
<script src="/js/login.js"></script></body></html>
